<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Секретный чат · шутка</title>
<style>
:root{
  --red:#EF3124; --red-soft:#FFEDEA; --ink:#1d1f2b; --muted:#8a8d9e;
  --line:#ebebf2; --bg:#f6f7fb; --card:#fff; --radius:20px;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
body{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- экран входа ---------- */
.entry{
  min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 520px at 10% -12%,#ffe8e4,transparent 62%),
             radial-gradient(820px 520px at 108% 112%,#e6ecff,transparent 62%),var(--bg);
}
.entry-card{
  width:min(100%,410px);background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:38px 34px;box-shadow:0 32px 70px -34px rgba(29,31,43,.28);
}
.logo{
  width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
  background:var(--red);color:#fff;box-shadow:0 12px 26px -12px rgba(239,49,36,.85);
}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--red);text-transform:uppercase;margin:22px 0 0}
.entry h1{font-size:clamp(26px,6vw,32px);line-height:1.15;margin:10px 0 12px;letter-spacing:-.02em}
.sub{color:var(--muted);line-height:1.55;margin:0 0 24px;font-size:14.5px}
.entry-online{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:#247b4d;
  background:#e9f8ef;border:1px solid #d8f0e2;border-radius:999px;padding:6px 12px;margin:0 0 24px;
}
.entry-online::before{content:"";width:7px;height:7px;border-radius:50%;background:#31a15a;box-shadow:0 0 0 3px #31a15a22}
.field-label{display:block;font-weight:650;font-size:13.5px;margin-bottom:8px;color:#4a4d5e}
.name-input{width:100%;border:1px solid #e2e3ec;border-radius:13px;padding:14px 15px;outline:none;background:#fbfbfe}
.name-input:focus{border-color:var(--red);box-shadow:0 0 0 4px #EF312417;background:#fff}
.primary{
  width:100%;border:0;border-radius:13px;padding:14px 16px;margin-top:12px;background:var(--red);color:#fff;
  font-weight:700;box-shadow:0 14px 26px -16px rgba(239,49,36,.9);transition:filter .15s,transform .15s;
}
.primary:hover{filter:brightness(1.04)}
.primary:active{transform:translateY(1px)}

/* ---------- чат ---------- */
.app{height:100dvh;display:flex;flex-direction:column;max-width:1080px;margin:auto;padding:18px;gap:14px}
.top{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 18px;
}
.brand-logo{
  width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:var(--red);color:#fff;box-shadow:0 8px 18px -10px rgba(239,49,36,.9);
}
.top h1{font-size:16px;margin:0;font-weight:750;letter-spacing:-.01em}
.top p{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.layout{display:grid;grid-template-columns:262px 1fr;gap:14px;min-height:0;flex:1}

.side{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;overflow:auto;min-height:0;display:flex;flex-direction:column}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.side h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;white-space:nowrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#e9f8ef;color:#247b4d;
  padding:5px 11px;font-size:12.5px;font-weight:700;white-space:nowrap;
}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#31a15a}
.people{list-style:none;padding:0;margin:0;flex:1;min-height:0;overflow:auto}
.people li{display:flex;align-items:center;gap:10px;padding:8px 0;overflow-wrap:anywhere}
.avatar{
  width:32px;height:32px;flex:none;border-radius:50%;background:var(--red-soft);border:1px solid #f6ded9;
  display:grid;place-items:center;font-size:17px;line-height:1;
}
.who{font-size:14px;font-weight:600}
.who .me{font-size:11px;color:#9a9dae;font-weight:500;margin-left:6px}
.rename{
  background:none;border:0;color:var(--red);padding:10px 0 0;margin-top:10px;border-top:1px solid var(--line);
  font-size:13px;font-weight:600;text-align:left;
}

.chat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;text-align:center;color:#9a9bab;line-height:1.7;font-size:14px}
.message{max-width:80%;align-self:flex-start;display:flex;gap:10px;align-items:flex-start}
.message.own{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:#f2f3f8;padding:10px 14px 11px;border-radius:16px 16px 16px 6px;overflow-wrap:anywhere;min-width:0}
.message.own .bubble{background:var(--red-soft);border-radius:16px 16px 6px 16px}
.msg-avatar{
  width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;
  background:#fff;border:1px solid var(--line);box-shadow:0 1px 4px rgba(29,31,43,.12);
}
.meta{font-size:11px;color:#8c8e9e;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.body{white-space:pre-wrap;font-size:14.5px;line-height:1.45}
.composer{display:flex;gap:10px;padding:13px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;padding:13px;border:1px solid #e3e4ec;border-radius:13px;outline:none;background:#fbfbfe}
.composer input:focus{border-color:var(--red);box-shadow:0 0 0 4px #EF312417;background:#fff}
.composer button{border:0;border-radius:13px;background:var(--red);color:#fff;padding:0 22px;font-weight:700}
.composer button:disabled{opacity:.5;cursor:not-allowed}

@media(max-width:680px){
  .app{padding:10px;gap:10px}
  .top{padding:11px 14px}
  .top h1{font-size:15px}
  .layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:10px}
  .side{padding:12px 14px;max-height:120px}
  .side-head{margin-bottom:6px}
  .people{display:flex;gap:14px;overflow-x:auto}
  .people li{flex:none;padding:0}
  .people .avatar{width:28px;height:28px;font-size:15px}
  .rename{margin:8px 0 0;padding:8px 0 0}
  .messages{padding:14px}
  .composer{padding:10px}
  .composer button{padding:0 16px}
  .msg-avatar{width:28px;height:28px;font-size:16px}
  .message{max-width:92%}
}
</style>
</head>
<body>
<section class="entry" id="entry">
  <div class="entry-card">
    <div class="logo"><svg height="42" viewBox="0 0 33 50" width="30" aria-label="Логотип Альфа-Банка" role="img"><path clip-rule="evenodd" d="M0 49.982v-6.825h32.61v6.825H0zm11.646-28.764h9.064L16.39 7.526h-.17l-4.573 13.692h-.001zm10.587-16.22l9.615 28.887h-7.115l-2.16-6.866H9.698l-2.33 6.867H.679l10.09-28.887C11.746 2.197 12.887 0 16.559 0s4.744 2.206 5.674 4.999v-.001z" fill="currentColor" fill-rule="evenodd"></path></svg></div>
    <p class="eyebrow">Только для своих</p>
    <h1>Вход в секретный чат Альфа-Банка</h1>
    <p class="sub">Ни регистрации, ни паролей — только имя, и ты внутри.</p>
    <div class="entry-online" id="entryOnline">1 онлайн</div>
    <form id="login">
      <label class="field-label" for="nickname">Твоё имя</label>
      <input class="name-input" id="nickname" maxlength="32" placeholder="Например, Саша" autocomplete="nickname" required>
      <button class="primary">Войти в чат →</button>
    </form>
  </div>
</section>

<main class="app hidden" id="app">
  <header class="top">
    <span class="brand-logo"><svg height="30" viewBox="0 0 33 50" width="21" aria-label="Логотип Альфа-Банка" role="img"><path clip-rule="evenodd" d="M0 49.982v-6.825h32.61v6.825H0zm11.646-28.764h9.064L16.39 7.526h-.17l-4.573 13.692h-.001zm10.587-16.22l9.615 28.887h-7.115l-2.16-6.866H9.698l-2.33 6.867H.679l10.09-28.887C11.746 2.197 12.887 0 16.559 0s4.744 2.206 5.674 4.999v-.001z" fill="currentColor" fill-rule="evenodd"></path></svg></span>
    <div>
      <h1>Секретный чат</h1>
      <p id="connection">Подключаемся…</p>
    </div>
  </header>
  <div class="layout">
    <aside class="side">
      <div class="side-head">
        <h2>Сейчас здесь</h2>
        <span class="pill" id="online">1 онлайн</span>
      </div>
      <ul class="people" id="people"></ul>
      <button class="rename" id="rename">Изменить имя</button>
    </aside>
    <section class="chat">
      <div class="messages" id="messages"><div class="empty">Пока тихо…<br>Начни разговор первым ✨</div></div>
      <form class="composer" id="composer">
        <input id="message" maxlength="1000" placeholder="Написать сообщение…" autocomplete="off" required>
        <button id="send" type="submit">Отправить</button>
      </form>
    </section>
  </div>
</main>

<script type="module">
import { joinRoom } from 'https://esm.sh/trystero@0.22.0';

const APP_ID = 'qr-secret-chat-alpha-fun-2026-change-me-8f29';
const ROOM_ID = 'secret-lounge';
const $ = id => document.getElementById(id);
const identityKey = 'qr-secret-chat-identity-v1';
const historyKey = 'qr-secret-chat-history-v1';
const HISTORY_LIMIT = 150;
// Сколько последних сообщений отдаём новому участнику.
const HISTORY_SHARE = 50;
// Пиннинг быстрых nostr-релеев. Дефолтный набор выбирается псевдослучайно по appId
// и включает регулярно лежащие релеи — из-за них первый коннект растягивается на десятки секунд.
const RELAY_URLS = [
  'wss://nos.lol',
  'wss://nostr.mom',
  'wss://relay.damus.io',
  'wss://relay.primal.net',
  'wss://nostr.wine',
  'wss://nostr-pub.wellorder.net'
];
// Дефолтный ICE-набор trystero — три stun.l.google.com + один cloudflare.
// stun.l.google.com во многих сетях режется, ICE-gathering виснет на несколько секунд.
// Поэтому переопределяем iceServers целиком: быстрые STUN + публичный TURN по TCP/TLS на крайний случай.
const ICE_SERVERS = [
  {urls: 'stun:stun.cloudflare.com:3478'},
  {urls: 'stuns:stun.nextcloud.com:443'},
  {urls: 'turn:openrelay.metered.ca:80?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject'},
  {urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject'}
];
const peers = new Map();
const history = new Map();
// Пул эмодзи для аватарок. Эмодзи выбирается по id участника (стабильно между устройствами),
// а коллизии разводятся пробом вперёд, чтобы в одном списке эмодзи не повторялись.
const EMOJI_POOL = [
  '😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰',
  '😘','😋','😜','🤪','🤨','🧐','🤓','😎','🥳','😏','😒','😞','😔','😟','😕','🙁',
  '☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','😳','🥵','🥶','😱',
  '😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦',
  '😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕',
  '🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','👽','🤖','🎃','👋','👍','👎',
  '✌️','🤞','🤟','🤘','👏','🙌','🙏','💪','🦄','🐻','🐼','🐨','🐯','🦁','🐸','🐵',
  '🐔','🐧','🐦','🦋','🐌','🐞','🐢','🐍','🦎','🐙','🦀','🐠','🐟','🐬','🐳','🦈',
  '🐊','🐅','🐆','🦓','🦍','🐘','🦛','🐪','🦒','🐃','🐄','🐎','🐏','🐑','🦙','🐐',
  '🦌','🐕','🐈','🐓','🦃','🦚','🦜','🦢','🕊️','🐇','🦝','🦨','🦡','🦦','🦥','🐁',
  '🌵','🌲','🌴','🌱','🌸','🌺','🌻','🌼','🌷','🌹','🍀','🍁','🍂','🍃','🌍','🌙',
  '⭐','🌟','✨','⚡','🔥','💧','🌊','❄️','☀️','🌈','🎯','🎲','🎮','🎧','🎸','🥁',
  '🚀','✈️','🚗','🏎️','🚲','⛵','🏰','🎪','🎡','🧸','🎁','🏆','🥇','⚽','🏀','🎾'
];
const emojiById = new Map();
const emojiOwner = new Map();
let room, sendProfile, sendMessage, sendHistoryRequest, sendHistoryChunk;
let receiveProfile, receiveMessage, receiveHistoryRequest, receiveHistoryChunk;
let inChat = false;

function hashId(str) {
  let hash = 2166136261;
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}
// Возвращает эмодзи для участника. Один и тот же id всегда даёт один и тот же эмодзи,
// но если эмодзи уже занят другим участником — берём следующий свободный.
function emojiFor(id) {
  const key = typeof id === 'string' && id ? id : 'guest';
  if (emojiById.has(key)) return emojiById.get(key);
  const base = hashId(key) % EMOJI_POOL.length;
  let picked = EMOJI_POOL[base];
  for (let i = 1; i < EMOJI_POOL.length; i++) {
    const candidate = EMOJI_POOL[(base + i) % EMOJI_POOL.length];
    if (!emojiOwner.has(candidate)) {
      picked = candidate;
      break;
    }
  }
  emojiById.set(key, picked);
  emojiOwner.set(picked, key);
  return picked;
}

// crypto.randomUUID доступен только в secure context — нужен запасной вариант.
function uuid() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
}

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
const saved = load(identityKey, {});
const me = {
  id: typeof saved.id === 'string' ? saved.id : uuid(),
  name: typeof saved.name === 'string' ? saved.name : ''
};
$('nickname').value = me.name;

function persistHistory() {
  try { localStorage.setItem(historyKey, JSON.stringify(sortedHistory())); }
  catch (error) { console.warn('History storage:', error); }
}
function sortedHistory() {
  return [...history.values()].sort((a, b) => a.time - b.time || a.id.localeCompare(b.id));
}
function normalizeMessage(data) {
  if (!data || typeof data.id !== 'string' || data.id.length > 100 ||
      typeof data.text !== 'string' || !data.text.trim() ||
      typeof data.name !== 'string' || !Number.isFinite(data.time)) return null;
  return {
    id: data.id,
    text: data.text.slice(0, 1000),
    name: data.name.slice(0, 32),
    time: Math.min(Date.now() + 60000, Math.max(0, data.time)),
    authorId: typeof data.authorId === 'string' ? data.authorId.slice(0, 100) : ''
  };
}
function mergeMessages(items) {
  let changed = false;
  for (const raw of items) {
    const msg = normalizeMessage(raw);
    if (msg && !history.has(msg.id)) {
      history.set(msg.id, msg);
      changed = true;
    }
  }
  if (!changed) return;
  const ordered = sortedHistory();
  for (const old of ordered.slice(0, Math.max(0, ordered.length - HISTORY_LIMIT))) {
    history.delete(old.id);
  }
  persistHistory();
  renderMessages();
}
function renderMessages() {
  const container = $('messages');
  const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
  container.replaceChildren();
  const ordered = sortedHistory();
  if (!ordered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Пока тихо… Начни разговор первым ✨';
    container.append(empty);
  }
  for (const data of ordered) {
    const own = data.authorId === me.id;
    const el = document.createElement('article');
    el.className = 'message' + (own ? ' own' : '');
    const avatar = document.createElement('span');
    avatar.className = 'msg-avatar';
    avatar.textContent = emojiFor(data.authorId || data.name);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const time = new Date(data.time).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
    meta.textContent = `${own ? 'Ты' : data.name || 'Гость'} · ${time}`;
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = data.text;
    bubble.append(meta, body);
    el.append(avatar, bubble);
    container.append(el);
  }
  if (atBottom) container.scrollTop = container.scrollHeight;
}
function addSystem(text) {
  // Системные события не входят в общую историю.
  console.info('[presence]', text);
}
// Единственный счётчик в интерфейсе — сколько людей сейчас подключено к комнате.
function updateOnline() {
  const count = peers.size + 1;
  $('online').textContent = `${count} онлайн`;
  $('entryOnline').textContent = `${count} онлайн`;
}
function renderPeople() {
  $('people').replaceChildren();
  const all = [
    ...(inChat ? [{name:me.name,self:true,id:me.id}] : []),
    ...[...peers.values()].filter(x => x.name).map(x => ({name:x.name,self:false,id:x.id || x.peerId}))
  ];
  for (const person of all) {
    const li = document.createElement('li');
    const av = document.createElement('span');
    av.className = 'avatar';
    av.textContent = emojiFor(person.id);
    const label = document.createElement('span');
    label.className = 'who';
    label.textContent = person.name;
    if (person.self) {
      const meTag = document.createElement('span');
      meTag.className = 'me';
      meTag.textContent = 'ты';
      label.append(meTag);
    }
    li.append(av, label);
    $('people').append(li);
  }
  updateOnline();
}
function profile() {
  return {id:me.id,name:inChat?me.name:''};
}
async function sendHistoryTo(peerId) {
  // Только свежий хвост истории: полная история забивает канал и задерживает живые сообщения.
  const items = sortedHistory().slice(-HISTORY_SHARE);
  // Небольшие порции, чтобы не превышать лимит сообщений WebRTC.
  for (let i = 0; i < items.length; i += 20) {
    await sendHistoryChunk({items: items.slice(i, i + 20)}, peerId);
  }
}
function connect() {
  if (room) return;
  if (!window.crypto || !window.crypto.subtle) {
    $('connection').textContent = 'Нужен HTTPS (или localhost): без secure context WebRTC не работает.';
    console.warn('crypto.subtle недоступен (не HTTPS?), trystero не сможет подключиться.');
    return;
  }
  try {
    // relayUrls фиксируют один и тот же набор релеев для всех участников: peer discovery
    // идёт через общий relay, поэтому рассинхрон релеев = люди не находят друг друга.
    room = joinRoom({appId:APP_ID, relayUrls:RELAY_URLS, rtcConfig:{iceServers:ICE_SERVERS}}, ROOM_ID);
    // makeAction возвращает [send, onData, onProgress]: второй элемент — приёмник,
    // а имя action ограничено 12 байтами (иначе trystero бросает ошибку).
    [sendProfile, receiveProfile] = room.makeAction('profile');
    [sendMessage, receiveMessage] = room.makeAction('chat');
    [sendHistoryRequest, receiveHistoryRequest] = room.makeAction('hist-request');
    [sendHistoryChunk, receiveHistoryChunk] = room.makeAction('hist-chunk');

    receiveProfile((data, peerId) => {
      if (!data || typeof data.id !== 'string' || typeof data.name !== 'string') return;
      peers.set(peerId, {
        peerId,
        name: data.name.slice(0,32),
        id: data.id.slice(0,100)
      });
      renderPeople();
    });
    receiveMessage((data, peerId) => {
      if (!data) return;
      const peer = peers.get(peerId);
      // Профиль пира может прийти позже сообщения — не теряем текст:
      // имя берём из профиля, если он есть, иначе из самого сообщения.
      mergeMessages([{
        ...data,
        name: peer?.name || data.name,
        authorId: peer?.id || data.authorId || ''
      }]);
    });
    receiveHistoryRequest(async (_data, peerId) => {
      try { await sendHistoryTo(peerId); }
      catch (error) { console.warn('History send:', error); }
    });
    receiveHistoryChunk(data => {
      if (Array.isArray(data?.items)) mergeMessages(data.items.slice(0, 20));
    });
    room.onPeerJoin(async peerId => {
      // id заполнится из профиля пира; до этого id пустой, чтобы не подменять authorId.
      if (!peers.has(peerId)) peers.set(peerId, {peerId,id:'',name:''});
      renderPeople();
      $('connection').textContent = 'Связь с участниками установлена';
      try {
        // Профиль шлём всем: так обе стороны узнают друг друга за один round-trip.
        await sendProfile(profile());
        // Историю запрашиваем с задержкой, чтобы не конкурировать с живыми сообщениями.
        setTimeout(() => {
          sendHistoryRequest({}, peerId).catch(error => console.warn('History request:', error));
        }, 1200);
      } catch (error) { console.warn('Peer sync:', error); }
    });
    room.onPeerLeave(peerId => {
      peers.delete(peerId);
      renderPeople();
      if (!peers.size) $('connection').textContent = 'Ожидаем других участников…';
    });
    $('connection').textContent = 'Ищем участников… (иногда это занимает время)';
  } catch (error) {
    console.error(error);
    $('connection').textContent = 'Не удалось подключиться: ' + (error?.message || error);
    room = null;
  }
}
function enter() {
  inChat = true;
  $('entry').classList.add('hidden');
  $('app').classList.remove('hidden');
  renderPeople();
  renderMessages();
  connect();
}
$('login').addEventListener('submit', event => {
  event.preventDefault();
  const name = $('nickname').value.trim();
  if (!name) return;
  me.name = name.slice(0,32);
  localStorage.setItem(identityKey, JSON.stringify(me));
  enter();
  if (sendProfile) sendProfile(profile()).catch(console.warn);
});
$('rename').addEventListener('click', () => {
  inChat = false;
  renderPeople();
  if (sendProfile) sendProfile(profile()).catch(console.warn);
  $('app').classList.add('hidden');
  $('entry').classList.remove('hidden');
  $('nickname').focus();
});
$('composer').addEventListener('submit', async event => {
  event.preventDefault();
  const input = $('message');
  const text = input.value.trim();
  if (!text) return;
  const data = {
    id: uuid(),
    text: text.slice(0,1000),
    name: me.name,
    authorId: me.id,
    time: Date.now()
  };
  mergeMessages([data]);
  input.value = '';
  if (sendMessage) {
    try { await sendMessage(data); }
    catch (error) { console.warn(error); addSystem('Не удалось доставить сообщение'); }
  }
});
for (const chunk of [load(historyKey, [])]) {
  if (Array.isArray(chunk)) mergeMessages(chunk.slice(-HISTORY_LIMIT));
}
renderPeople();
connect();
</script>
